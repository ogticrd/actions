name: "GCP Authentication"
description: "Authenticate to Google Cloud Platform using JSON key or Workload Identity Federation"
author: "OGTIC"

inputs:
  project-id:
    description: "GCP project ID"
    required: true
  credentials-json:
    description: "Service account JSON key (legacy method)"
    required: false
    default: ""
  workload-identity-provider:
    description: "Workload Identity Federation provider resource name"
    required: false
    default: ""
  service-account:
    description: "Service account email for Workload Identity Federation"
    required: false
    default: ""
  setup-gcloud:
    description: "Whether to set up the gcloud CLI"
    required: false
    default: "true"

outputs:
  access-token:
    description: "OAuth2 access token"
    value: ${{ steps.auth-json.outputs.access_token || steps.auth-wif.outputs.access_token }}
  project-id:
    description: "Resolved GCP project ID"
    value: ${{ inputs.project-id }}

runs:
  using: "composite"
  steps:
    - name: Validate authentication inputs
      shell: bash
      env:
        CREDENTIALS_JSON: ${{ inputs.credentials-json }}
        WIF_PROVIDER: ${{ inputs.workload-identity-provider }}
        SERVICE_ACCOUNT: ${{ inputs.service-account }}
      run: |
        if [[ -z "$CREDENTIALS_JSON" && -z "$WIF_PROVIDER" ]]; then
          echo "::error::Either 'credentials-json' or 'workload-identity-provider' must be provided"
          exit 1
        fi
        if [[ -n "$WIF_PROVIDER" && -z "$SERVICE_ACCOUNT" ]]; then
          echo "::error::'service-account' is required when using Workload Identity Federation"
          exit 1
        fi

    - name: Authenticate with JSON key
      id: auth-json
      if: inputs.credentials-json != ''
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ inputs.project-id }}
        credentials_json: ${{ inputs.credentials-json }}

    - name: Authenticate with Workload Identity Federation
      id: auth-wif
      if: inputs.workload-identity-provider != ''
      uses: google-github-actions/auth@v3
      with:
        project_id: ${{ inputs.project-id }}
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}

    - name: Set up Cloud SDK
      if: inputs.setup-gcloud == 'true'
      uses: google-github-actions/setup-gcloud@v3
