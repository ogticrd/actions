name: "Docker Build & Push"
description: "Build and push Docker images to any OCI-compatible container registry"
author: "OGTIC"

inputs:
  registry:
    description: "Container registry URL"
    required: false
    default: "us-docker.pkg.dev"
  registry-username:
    description: "Registry username (_json_key for GAR, github.actor for GHCR)"
    required: true
  registry-password:
    description: "Registry password or token"
    required: true
  image-name:
    description: "Image name (e.g., project-id/repo/app). Can include registry prefix — it will be stripped automatically"
    required: true
  dockerfile:
    description: "Path to Dockerfile"
    required: false
    default: "Dockerfile"
  context:
    description: "Build context path"
    required: false
    default: "."
  target:
    description: "Target stage for multi-stage builds"
    required: false
    default: ""
  build-args:
    description: "Build arguments (multiline KEY=VALUE)"
    required: false
    default: ""
  build-secrets:
    description: "Build secrets for Docker --secret"
    required: false
    default: ""
  platforms:
    description: "Target platforms (e.g., linux/amd64,linux/arm64)"
    required: false
    default: "linux/amd64"
  push:
    description: "Push image to registry"
    required: false
    default: "true"
  environment:
    description: "Environment name for tagging (e.g., production, staging)"
    required: false
    default: ""
  cache-strategy:
    description: "Cache strategy: registry (default, persistent), gha (GitHub Actions), or none"
    required: false
    default: "registry"
  extra-tags:
    description: "Additional custom tags (multiline, docker/metadata-action format)"
    required: false
    default: ""

outputs:
  image:
    description: "All generated image tags (multiline)"
    value: ${{ steps.meta.outputs.tags }}
  primary-image:
    description: "Primary image with SHA tag (use this for deployments)"
    value: ${{ steps.image-outputs.outputs.primary }}
  digest:
    description: "Image digest"
    value: ${{ steps.build.outputs.digest }}
  image-tag:
    description: "Short SHA tag (7 characters)"
    value: ${{ steps.image-outputs.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Normalize image name
      id: normalize
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE_NAME: ${{ inputs.image-name }}
      run: |
        # Strip registry prefix if already included in image-name
        if [[ "$IMAGE_NAME" == "$REGISTRY"/* ]]; then
          IMAGE_NAME="${IMAGE_NAME#$REGISTRY/}"
        fi
        echo "image-name=${IMAGE_NAME}" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Generate image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ steps.normalize.outputs.image-name }}
        tags: |
          type=sha,prefix=
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=ref,event=tag
          type=edge,enable={{is_default_branch}}
          type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
          type=raw,value=${{ inputs.environment }},enable=${{ inputs.environment != '' }}
          ${{ inputs.extra-tags }}
        labels: |
          org.opencontainers.image.title=${{ steps.normalize.outputs.image-name }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}

    - name: Determine cache configuration
      id: cache-config
      shell: bash
      env:
        CACHE_STRATEGY: ${{ inputs.cache-strategy }}
        REGISTRY: ${{ inputs.registry }}
        IMAGE_NAME: ${{ steps.normalize.outputs.image-name }}
      run: |
        # Generate URL-safe branch slug for cache keys
        BRANCH_SLUG=$(echo "${GITHUB_REF_NAME}" | sed 's/[^a-zA-Z0-9]/-/g' | tr '[:upper:]' '[:lower:]' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
        DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"

        case "$CACHE_STRATEGY" in
          "registry")
            CACHE_FROM=$(cat <<EOF
        type=registry,ref=${REGISTRY}/${IMAGE_NAME}:${BRANCH_SLUG}-cache
        type=registry,ref=${REGISTRY}/${IMAGE_NAME}:${DEFAULT_BRANCH}-cache
        type=registry,ref=${REGISTRY}/${IMAGE_NAME}:latest-cache
        EOF
        )
            CACHE_TO="type=registry,ref=${REGISTRY}/${IMAGE_NAME}:${BRANCH_SLUG}-cache,mode=max"
            ;;
          "gha")
            CACHE_FROM="type=gha,scope=${IMAGE_NAME}"
            CACHE_TO="type=gha,scope=${IMAGE_NAME},mode=max"
            ;;
          "none")
            CACHE_FROM=""
            CACHE_TO=""
            ;;
          *)
            CACHE_FROM="type=gha,scope=${IMAGE_NAME}"
            CACHE_TO="type=gha,scope=${IMAGE_NAME},mode=max"
            ;;
        esac

        {
          echo "cache-from<<EOF"
          echo "$CACHE_FROM"
          echo "EOF"
          echo "cache-to<<EOF"
          echo "$CACHE_TO"
          echo "EOF"
        } >> $GITHUB_OUTPUT

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: ${{ inputs.build-args }}
        secrets: ${{ inputs.build-secrets }}
        target: ${{ inputs.target }}
        cache-from: ${{ steps.cache-config.outputs.cache-from }}
        cache-to: ${{ steps.cache-config.outputs.cache-to }}

    - name: Generate image outputs
      id: image-outputs
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE_NAME: ${{ steps.normalize.outputs.image-name }}
      run: |
        SHORT_SHA="${GITHUB_SHA:0:7}"
        PRIMARY_IMAGE="${REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}"
        echo "primary=${PRIMARY_IMAGE}" >> $GITHUB_OUTPUT
        echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT

    - name: Output summary
      shell: bash
      run: |
        echo "## Docker Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
        echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| **Image** | \`${{ inputs.registry }}/${{ steps.normalize.outputs.image-name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Digest** | \`${{ steps.build.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Environment** | ${{ inputs.environment || 'N/A' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Platforms** | ${{ inputs.platforms }} |" >> $GITHUB_STEP_SUMMARY
        echo "| **Cache** | ${{ inputs.cache-strategy }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Tags" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
